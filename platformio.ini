[platformio]
default_envs = esp32-wroom-32
; To build for TZT ESP32 LVGL screen, use: pio run -e tzt-esp32-lvgl
; To test TZT code on ESP32 DevKit (no display), use: pio run -e tzt-esp32-devkit
; To build for original ESP32, use: pio run -e esp32-wroom-32
; To build with debug symbols for exception decoding, use: pio run -e esp32-wroom-32-debug

[env:esp32-wroom-32]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
; Try slower speeds if upload fails: 230400, 115200, 921600
upload_flags = 
    --before=default_reset
    --after=hard_reset

# Flash settings - fix "invalid header" errors
board_build.flash_mode = dio
board_build.freq = 40m
board_build.flash_size = 4MB
board_build.partitions = default.csv

# Main ESP32: hardware + ESP-NOW only. Exclude TZT, Firebase, Reminder, RequestQueue.
# +<*> includes all; -<tzt-display/> -<FirebaseService.cpp> -<ReminderService.cpp> -<RequestQueue.cpp>
build_src_filter = +<*> -<tzt-display/> -<FirebaseService.cpp> -<ReminderService.cpp> -<RequestQueue.cpp>
upload_port = COM5
monitor_port = COM5  
# Library dependencies
lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.3
    tzapu/WiFiManager@^2.0.17
    # ArduinoOTA is built into ESP32 Arduino Core
# Build flags for optimization and debugging
# Reduced debug levels to save flash memory (~5-10KB saved)
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DSERIAL_DEBUG=0
    -DUSBCDC_ENABLED=0
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -DCONFIG_LOG_DEFAULT_LEVEL_WARN=1
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_FREERTOS_HZ=1000
    # Disabled FreeRTOS tracing features to save flash (~3-5KB saved)
    # -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
    # -DCONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
    # -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
    # -DCONFIG_FREERTOS_USE_IDLE_HOOK=1
    # -DCONFIG_FREERTOS_USE_TICK_HOOK=1
    # Power management - Brown-out detector settings
    # Note: Removed override to avoid conflicts with SDK defaults
    # If you need to disable BOD, configure via menuconfig or sdkconfig

# Monitor filters for better debugging
monitor_filters = 
    esp32_exception_decoder
    time

# ============================================================================
# ESP32 WROOM Debug build (exception decoding, stack traces, verbose logs)
# ============================================================================
; Use: pio run -e esp32-wroom-32-debug
; Then: pio run -e esp32-wroom-32-debug --target upload -t monitor
[env:esp32-wroom-32-debug]
extends = env:esp32-wroom-32
build_type = debug
; Verbose logging so exceptions and stack traces show more detail
build_flags = 
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DSERIAL_DEBUG=1
    -DUSBCDC_ENABLED=0
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DCONFIG_LOG_DEFAULT_LEVEL=4
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_FREERTOS_HZ=1000

# ============================================================================
# TZT ESP32 LVGL Screen Environment
# ============================================================================
[env:tzt-esp32-lvgl]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
upload_flags = 
    --before=default_reset
    --after=hard_reset

# Flash settings
board_build.flash_mode = dio
board_build.freq = 80m
board_build.flash_size = 4MB
board_build.partitions = default.csv

# Library dependencies for LVGL display
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    tzapu/WiFiManager@^2.0.17
    lvgl/lvgl@^8.3.0
    bodmer/TFT_eSPI@^2.5.0

# Build flags for LVGL display
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DSERIAL_DEBUG=0
    -DUSBCDC_ENABLED=0
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -DCONFIG_LOG_DEFAULT_LEVEL_WARN=1
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_FREERTOS_HZ=1000
    -DTZT_ESP32_LVGL=1
    -I TFT_eSPI_Setup
    ; Define this flag to enable TZT-specific code in shared files

# TZT: web + Firebase + ESP-NOW. Include tzt-display, Firebase, Reminder, Logger.
build_src_filter = -<*> +<tzt-display/> +<FirebaseService.cpp> +<ReminderService.cpp> +<Logger.cpp>

# Monitor filters
monitor_filters = 
    esp32_exception_decoder
    time

# ============================================================================
# TZT on ESP32 DevKit (no display) - for testing without TZT screen hardware
# ============================================================================
; Use: pio run -e tzt-esp32-devkit --target upload
[env:tzt-esp32-devkit]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
upload_port = COM4
monitor_port = COM4
upload_flags = 
    --before=default_reset
    --after=hard_reset

board_build.flash_mode = dio
board_build.freq = 80m
board_build.flash_size = 4MB
board_build.partitions = default.csv

lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    tzapu/WiFiManager@^2.0.17

build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DSERIAL_DEBUG=0
    -DUSBCDC_ENABLED=0
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -DCONFIG_LOG_DEFAULT_LEVEL_WARN=1
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_FREERTOS_HZ=1000
    -DTZT_ESP32_LVGL=1
    -DTZT_HEADLESS=1

build_src_filter = -<*> +<tzt-display/> +<FirebaseService.cpp> +<ReminderService.cpp> +<Logger.cpp>

monitor_filters = 
    esp32_exception_decoder
    time
