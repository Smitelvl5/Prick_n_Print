[platformio]
default_envs = esp32-wroom-32
; === Upload and monitor (build + upload + open serial) ===
;   Main ESP32:    pio run -e esp32-wroom-32 -t upload -t monitor
;   TZT Display:   pio run -e tzt-esp32-devkit -t upload -t monitor
; Build only: pio run -e <env>
; Debug build: pio run -e esp32-wroom-32-debug
; OTA (after first USB flash, board on WiFi): pio run -e esp32-wroom-32-ota -t upload
;              pio run -e tzt-esp32-devkit-ota -t upload

[env:esp32-wroom-32]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
; Try slower speeds if upload fails: 230400, 115200, 921600
upload_flags =
    --before=default_reset
    --after=hard_reset

# Flash settings - fix "invalid header" errors
board_build.flash_mode = dio
board_build.freq = 40m
board_build.flash_size = 4MB
board_build.partitions = default.csv

# Main ESP32: hardware + ESP-NOW only. Exclude TZT, Reminder, RequestQueue.
# +<*> includes all; -<tzt-display/> -<ReminderService.cpp> -<RequestQueue.cpp>
build_src_filter = +<*> -<tzt-display/> -<ReminderService.cpp> -<RequestQueue.cpp>
upload_port = COM3
monitor_port = COM3
; Main on COM3, TZT on COM7 — close monitor on target port before upload
# Library dependencies
lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.3
    tzapu/WiFiManager@^2.0.17
    # ArduinoOTA is built into ESP32 Arduino Core
# Build flags for optimization and debugging
# Reduced debug levels to save flash memory (~5-10KB saved)
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DSERIAL_DEBUG=0
    -DUSBCDC_ENABLED=0
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -DCONFIG_LOG_DEFAULT_LEVEL_WARN=1
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_FREERTOS_HZ=1000
    # Disabled FreeRTOS tracing features to save flash (~3-5KB saved)
    # -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
    # -DCONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
    # -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
    # -DCONFIG_FREERTOS_USE_IDLE_HOOK=1
    # -DCONFIG_FREERTOS_USE_TICK_HOOK=1
    # Power management - Brown-out detector settings
    # Note: Removed override to avoid conflicts with SDK defaults
    # If you need to disable BOD, configure via menuconfig or sdkconfig

# Monitor filters for better debugging
monitor_filters = 
    esp32_exception_decoder
    time

# ============================================================================
# ESP32 WROOM Debug build (exception decoding, stack traces, verbose logs)
# ============================================================================
; Use: pio run -e esp32-wroom-32-debug
; Then: pio run -e esp32-wroom-32-debug --target upload -t monitor
[env:esp32-wroom-32-debug]
extends = env:esp32-wroom-32
build_type = debug
; Verbose logging so exceptions and stack traces show more detail
build_flags = 
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DSERIAL_DEBUG=1
    -DUSBCDC_ENABLED=0
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DCONFIG_LOG_DEFAULT_LEVEL=4
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_FREERTOS_HZ=1000

# ============================================================================
# Main ESP32: OTA upload (over WiFi, no USB needed). Board must already be
# running firmware with OTAUpdateService (hostname "Print-n-Prick").
# ============================================================================
; Use: pio run -e esp32-wroom-32-ota -t upload
[env:esp32-wroom-32-ota]
extends = env:esp32-wroom-32
extra_scripts = pre:scripts/ota_upload_auth.py
upload_protocol = espota
upload_port = Print-n-Prick.local
; Clear parent's esptool-only flags (--before/--after); espota.py doesn't understand them.
; ota_upload_auth.py appends the --auth flag separately.
upload_flags =
; If mDNS resolution fails on your network, replace upload_port above with the board's IP address.

# ============================================================================
# TZT ESP32 LVGL Screen Environment
# ============================================================================
[env:tzt-esp32-lvgl]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
upload_flags = 
    --before=default_reset
    --after=hard_reset

# Flash settings
board_build.flash_mode = dio
board_build.freq = 80m
board_build.flash_size = 4MB
board_build.partitions = default.csv

# Library dependencies for LVGL display
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    tzapu/WiFiManager@^2.0.17
    lvgl/lvgl@^8.3.0
    bodmer/TFT_eSPI@^2.5.0
    earlephilhower/ESP8266Audio@^1.9.7

# Build flags for LVGL display (copy_tft_user_setup.py copies include/User_Setup.h into TFT_eSPI)
build_flags = 
    -I $PROJECT_DIR/include
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DSERIAL_DEBUG=0
    -DUSBCDC_ENABLED=0
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -DCONFIG_LOG_DEFAULT_LEVEL_WARN=1
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_FREERTOS_HZ=1000
    -DTZT_ESP32_LVGL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; Define this flag to enable TZT-specific code in shared files

# TZT: web + HTTP backend + ESP-NOW + OTA. Include tzt-display, HttpBackendService, Reminder, Logger, OTA.
build_src_filter = -<*> +<tzt-display/> +<HttpBackendService.cpp> +<ReminderService.cpp> +<Logger.cpp> +<OTAUpdateService.cpp>

# Monitor filters
monitor_filters =
    esp32_exception_decoder
    time

# ============================================================================
# TZT on ESP32 DevKit with TFT display (same firmware as tzt-esp32-lvgl, different port)
# ============================================================================
; Use: pio run -e tzt-esp32-devkit -t upload -t monitor
[env:tzt-esp32-devkit]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
upload_port = COM7
monitor_port = COM7
; COM3 = CP210x (Main), COM7 = CH340 (TZT) — set to the port the TZT display is on
upload_flags = 
    --before=default_reset
    --after=hard_reset

board_build.flash_mode = dio
board_build.freq = 80m
board_build.flash_size = 4MB
; Larger app partition (~1.9MB) so LVGL+TFT firmware fits; less SPIFFS
board_build.partitions = min_spiffs.csv

lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    tzapu/WiFiManager@^2.0.17
    lvgl/lvgl@^8.3.0
    bodmer/TFT_eSPI@^2.5.0
    earlephilhower/ESP8266Audio@^1.9.7
    bodmer/JPEGDecoder@^1.0.0

; Copy include/User_Setup.h into TFT_eSPI lib before build so library uses our pins/driver
extra_scripts = pre:scripts/copy_tft_user_setup.py

build_flags = 
    -I $PROJECT_DIR/include
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DSERIAL_DEBUG=0
    -DUSBCDC_ENABLED=0
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -DCONFIG_LOG_DEFAULT_LEVEL_WARN=1
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_FREERTOS_HZ=1000
    -DTZT_ESP32_LVGL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

build_src_filter = -<*> +<tzt-display/> +<HttpBackendService.cpp> +<ReminderService.cpp> +<Logger.cpp> +<OTAUpdateService.cpp>

monitor_filters =
    esp32_exception_decoder
    time

# ============================================================================
# TZT Display: OTA upload (over WiFi, no USB needed). Board must already be
# running firmware with OTAUpdateService (hostname "TZT-Display").
# ============================================================================
; Use: pio run -e tzt-esp32-devkit-ota -t upload
[env:tzt-esp32-devkit-ota]
extends = env:tzt-esp32-devkit
extra_scripts =
    pre:scripts/copy_tft_user_setup.py
    pre:scripts/ota_upload_auth.py
upload_protocol = espota
upload_port = TZT-Display.local
; Clear parent's esptool-only flags (--before/--after); espota.py doesn't understand them.
; ota_upload_auth.py appends the --auth flag separately.
upload_flags =
; If mDNS resolution fails on your network, replace upload_port above with the board's IP address.
