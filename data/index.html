<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Print-n-Prick - Thermal printer with a cactus pot. Remote control for your smart cactus care device.">
    <meta name="apple-mobile-web-app-title" content="Print-n-Prick">
    <title>Print-n-Prick Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a120c 0%, #1a3d0e 25%, #2d5016 50%, #4a7c2a 75%, #6b9f3d 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '🌵';
            position: fixed;
            font-size: 280px;
            opacity: 0.05;
            top: -80px;
            left: -80px;
            z-index: 0;
        }
        body::after {
            content: '🖨️';
            position: fixed;
            font-size: 200px;
            opacity: 0.05;
            bottom: -60px;
            right: -60px;
            z-index: 0;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: linear-gradient(135deg, #f5f5f0 0%, #ffffff 100%);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(26, 18, 12, 0.5), 0 0 0 3px rgba(74, 124, 42, 0.2), inset 0 0 0 1px rgba(62, 39, 35, 0.15);
            border: 3px solid #4a7c2a;
            border-left: 4px solid #3e2723;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        .header {
            background: linear-gradient(135deg, #2c1810 0%, #2d5016 40%, #4a7c2a 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .header p {
            opacity: 0.95;
            font-size: 14px;
        }
        
        .content {
            padding: 20px;
        }
        
        .status-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #4a7c2a;
            border-left: 4px solid #8b4513;
            box-shadow: 0 4px 8px rgba(62, 39, 35, 0.08);
        }
        
        .status-card h3 {
            color: #2d5016;
            margin-bottom: 12px;
            font-size: 16px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #e8ecd8;
        }
        
        .status-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .status-label {
            font-weight: 500;
            color: #333;
        }
        
        .status-value {
            font-weight: 600;
        }
        
        .status-ok { color: #2d5016; }
        .status-error { color: #dc3545; }
        .status-warning { color: #8b4513; }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2d5016 0%, #4a7c2a 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(45, 80, 22, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #2d5016 0%, #4a7c2a 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(45, 80, 22, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(139, 69, 19, 0.4);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #6b9f3d 0%, #5a8a32 100%);
            color: white;
        }
        
        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(107, 159, 61, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message-container {
            position: relative;
            margin-bottom: 15px;
        }
        
        .message-input {
            width: 100%;
            padding: 15px;
            padding-bottom: 35px;
            border: 2px solid #4a7c2a;
            border-bottom: 3px solid #3e2723;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
            background: #fff;
        }
        
        .message-input:focus {
            outline: none;
            border-color: #6b9f3d;
            border-bottom-color: #8b4513;
            box-shadow: 0 0 0 3px rgba(74, 124, 42, 0.2);
        }
        
        .char-counter {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 12px;
            color: #3e2723;
            font-weight: 500;
        }
        
        .char-counter.warning {
            color: #8b4513;
        }
        
        .char-counter.danger {
            color: #dc3545;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            background: linear-gradient(135deg, #2d5016 0%, #4a7c2a 100%);
            border: 1px solid #6b9f3d;
        }
        
        .notification.error {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            border: 1px solid #c17a4a;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #e8ecd8;
            border-top-color: #4a7c2a;
            border-right-color: #8b4513;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .refresh-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        
        .info-box {
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
            border: 2px solid #4a7c2a;
            border-left: 4px solid #6b9f3d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1b5e20;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌵 Print-n-Prick</h1>
            <p>Thermal printer with a cactus pot</p>
        </div>
        
        <div class="content">
            <div class="status-card">
                <h3>📊 System Status</h3>
                <div id="status-content">
                    <div class="status-item">
                        <span class="status-label">WiFi</span>
                        <span class="status-value" id="wifi-status">Loading...</span>
                    </div>
                </div>
            </div>
            
            <div>
                <div class="message-container">
                    <textarea class="message-input" id="messageInput" placeholder="Enter message to print..." maxlength="500" rows="4" style="resize: vertical; min-height: 80px;"></textarea>
                    <div class="char-counter" id="charCounter">0/500 characters</div>
                </div>
                <button class="btn btn-primary" onclick="sendMessage()" style="width: 100%;">🖨️ Print Message</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing...</p>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification"></div>

    <script>
        // Firebase configuration
        const FIREBASE_URL = 'https://printerpot-d96f8-default-rtdb.firebaseio.com';
        
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        async function sendCommand(commandType, commandData = '', options = {}) {
            showLoading();
            try {
                const command = {
                    id: Date.now().toString(),
                    type: commandType,
                    data: commandData,
                    timestamp: new Date().toISOString(),
                    processed: false,
                    ...options
                };
                const response = await fetch(`${FIREBASE_URL}/commands.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(command)
                });
                if (response.ok) {
                    showNotification('Command sent successfully!', 'success');
                    refreshStatus();
                } else {
                    showNotification('Failed to send command', 'error');
                }
            } catch (error) {
                showNotification('Error sending command: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }
        
        async function refreshStatus() {
            try {
                const response = await fetch(`${FIREBASE_URL}/status.json`);
                if (response.ok) {
                    const status = await response.json();
                    updateStatusDisplay(status);
                } else {
                    showNotification('Failed to get status', 'error');
                }
            } catch (error) {
                showNotification('Error getting status: ' + error.message, 'error');
            }
        }
        
        function updateStatusDisplay(status) {
            document.getElementById('wifi-status').textContent = status.wifi ? '✅ Connected' : '❌ Disconnected';
            document.getElementById('wifi-status').className = `status-value ${status.wifi ? 'status-ok' : 'status-error'}`;
        }
        
        function sendMessage() {
            const message = document.getElementById('messageInput').value.trim();
            if (message) {
                if (message.length > 500) {
                    showNotification('Message too long! Maximum 500 characters allowed.', 'error');
                    return;
                }
                // source: "web" → printer shows message only (no title, date, weather). Shortcut uses "shortcut" or omits for full receipt.
                sendCommand('print', message, { source: 'web' });
                document.getElementById('messageInput').value = '';
                updateCharCounter();
            } else {
                showNotification('Please enter a message', 'error');
            }
        }
        
        const messageInput = document.getElementById('messageInput');
        const charCounter = document.getElementById('charCounter');
        
        function updateCharCounter() {
            const length = messageInput.value.length;
            const maxLength = 500;
            charCounter.textContent = `${length}/${maxLength} characters`;
            charCounter.className = 'char-counter';
            if (length > maxLength * 0.8) charCounter.classList.add('warning');
            if (length > maxLength * 0.95) charCounter.classList.add('danger');
        }
        
        messageInput.addEventListener('input', updateCharCounter);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Auto-refresh status every 30 seconds
        setInterval(refreshStatus, 30000);
        
        refreshStatus();
        updateCharCounter();
    </script>
</body>
</html>
