<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prick_n_Print — Console</title>
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      font-weight: 400 700;
      font-display: swap;
      src: local('JetBrains Mono'), local('JetBrainsMono-Regular');
    }

    :root {
      --bg: #0b0d10;
      --surface: #14171c;
      --surface-2: #1b1f26;
      --surface-hover: #20242c;
      --border: #262b33;
      --border-strong: #333a45;
      --text: #e7e9ec;
      --text-muted: #8b93a1;
      --text-faint: #565e6b;
      --accent: #4f8cff;
      --accent-hover: #6b9dff;
      --accent-dim: rgba(79, 140, 255, 0.14);
      --ok: #3ddc84;
      --ok-dim: rgba(61, 220, 132, 0.14);
      --warn: #f5a623;
      --danger: #ff5470;
      --danger-hover: #ff7089;
      --danger-dim: rgba(255, 84, 112, 0.14);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Consolas, monospace;
    }

    :root[data-theme="light"] {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #eef0f3;
      --surface-hover: #e6e9ed;
      --border: #dde1e7;
      --border-strong: #c7ccd4;
      --text: #14171c;
      --text-muted: #5a6270;
      --text-faint: #96a0ae;
      --accent: #2f6fe4;
      --accent-hover: #1f5bd0;
      --accent-dim: rgba(47, 111, 228, 0.1);
      --ok: #17a866;
      --ok-dim: rgba(23, 168, 102, 0.12);
      --warn: #b3730a;
      --danger: #e0304f;
      --danger-hover: #c8253f;
      --danger-dim: rgba(224, 48, 79, 0.1);
      --shadow: 0 8px 24px rgba(20, 23, 28, 0.08);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --surface-2: #eef0f3;
        --surface-hover: #e6e9ed;
        --border: #dde1e7;
        --border-strong: #c7ccd4;
        --text: #14171c;
        --text-muted: #5a6270;
        --text-faint: #96a0ae;
        --accent: #2f6fe4;
        --accent-hover: #1f5bd0;
        --accent-dim: rgba(47, 111, 228, 0.1);
        --ok: #17a866;
        --ok-dim: rgba(23, 168, 102, 0.12);
        --warn: #b3730a;
        --danger: #e0304f;
        --danger-hover: #c8253f;
        --danger-dim: rgba(224, 48, 79, 0.1);
        --shadow: 0 8px 24px rgba(20, 23, 28, 0.08);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark light; }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); }

    .container { max-width: 1040px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .masthead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .masthead-id { display: flex; align-items: baseline; gap: 0.65rem; }
    .masthead h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .masthead .unit {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-faint);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .masthead .subtitle {
      color: var(--text-muted);
      font-size: 0.8125rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .status-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
    }
    .status-pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--border)); }
    .status-pill.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-dim); }
    .status-pill.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
    .status-pill.bad .dot { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-dim); }

    .tabs {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .tabs button {
      padding: 0.65rem 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }
    .card h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .card .card-note {
      color: var(--text-muted);
      font-size: 0.8125rem;
      margin-bottom: 1rem;
    }

    .hist-panel { display: none; }
    .hist-panel.active { display: block; }
    .history-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .history-tabs button {
      padding: 0.4rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .history-tabs button:hover { border-color: var(--border-strong); color: var(--text); }
    .history-tabs button.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

    .hist-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .hist-actions .spacer { flex: 1; }
    .hist-actions .field-label {
      color: var(--text-faint);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .hist-actions select {
      padding: 0.4rem 0.65rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      font-size: 0.8125rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-strong); }
    .btn-danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
    .btn-danger:hover { background: var(--danger-dim); border-color: var(--danger); }
    .btn-danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-danger.solid:hover { background: var(--danger-hover); }
    .btn.confirming {
      background: var(--danger) !important;
      color: #fff !important;
      border-color: var(--danger) !important;
      animation: pulse 0.9s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }

    .history-list { max-height: 460px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 0.9rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
    }
    .history-item .text { word-break: break-word; }
    .history-item .meta {
      color: var(--text-faint);
      font-size: 0.75rem;
      font-family: var(--font-mono);
      margin-top: 0.2rem;
    }
    .history-item .actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .empty {
      color: var(--text-faint);
      font-size: 0.8125rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.85rem; }
    .img-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .img-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--bg); }
    .img-card .info {
      padding: 0.5rem 0.6rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .img-card .img-actions { padding: 0 0.6rem 0.6rem; display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .img-grid .empty { grid-column: 1 / -1; }

    .device-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .device-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; box-shadow: 0 0 0 3px var(--ok-dim); }
    .device-dot.stale { background: var(--text-faint); box-shadow: none; }
    .device-name { font-weight: 500; }
    .device-id { font-family: var(--font-mono); color: var(--text-faint); font-size: 0.75rem; }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.7rem 1.1rem;
      background: var(--surface);
      border: 1px solid var(--ok);
      border-radius: 8px;
      color: var(--ok);
      font-size: 0.8125rem;
      font-weight: 500;
      box-shadow: var(--shadow);
      z-index: 1000;
      animation: slideIn 0.25s ease;
    }
    .toast.err { border-color: var(--danger); color: var(--danger); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .toast, .btn.confirming { animation: none; }
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="masthead">
      <div>
        <div class="masthead-id">
          <h1>Prick_n_Print</h1>
          <span class="unit">console</span>
        </div>
        <p class="subtitle">Delivery log and connected devices — send from iOS Shortcuts</p>
      </div>
      <span class="status-pill" id="connPill"><span class="dot"></span><span id="connLabel">connecting</span></span>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="history">History</button>
      <button type="button" class="tab-btn" data-tab="devices">Devices</button>
    </div>

    <div id="panel-history" class="tab-panel active">
      <div class="history-tabs">
        <button type="button" class="hist-tab active" data-hist="messages">Messages</button>
        <button type="button" class="hist-tab" data-hist="images">Images</button>
        <button type="button" class="hist-tab" data-hist="audio">Audio</button>
      </div>
      <div class="hist-actions">
        <span class="field-label">Sort</span>
        <select id="sortOrder">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
        <button type="button" class="btn btn-ghost" id="refreshBtn">Refresh</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" id="clearMessagesBtn">Clear messages</button>
        <button type="button" class="btn btn-ghost" id="clearImagesBtn">Clear images</button>
        <button type="button" class="btn btn-ghost" id="clearAudioBtn">Clear audio</button>
        <button type="button" class="btn btn-danger solid" id="clearAllBtn">Clear all</button>
      </div>
      <div id="history-messages" class="hist-panel active">
        <div class="history-list" id="historyMessagesList"><div class="empty">Loading…</div></div>
      </div>
      <div id="history-images" class="hist-panel">
        <div class="img-grid" id="historyImagesList"></div>
      </div>
      <div id="history-audio" class="hist-panel">
        <div class="history-list" id="historyAudioList"><div class="empty">Loading…</div></div>
      </div>
    </div>

    <div id="panel-devices" class="tab-panel">
      <div class="card">
        <h2>Connected devices</h2>
        <p class="card-note">ESP32s that have sent a heartbeat appear here. TZT Display and Main ESP32 register when they poll.</p>
        <div id="devicesList" class="history-list"><div class="empty">Loading…</div></div>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" style="display:none"></audio>
  <div id="toast"></div>

  <script>
    const API = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
    const API_KEY = {{ api_key | tojson }};
    const AUTH_HEADERS = { 'X-API-Key': API_KEY };
    let historyData = { messages: [], images: [], audio: [], devices: {} };
    let currentAudioUrl = null;
    let sortNewestFirst = true;

    function showToast(msg, err = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast' + (err ? ' err' : '');
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function setConn(ok) {
      const pill = document.getElementById('connPill');
      const label = document.getElementById('connLabel');
      pill.className = 'status-pill ' + (ok ? 'ok' : 'bad');
      label.textContent = ok ? 'online' : 'unreachable';
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString();
    }

    async function loadHistory() {
      try {
        const r = await fetch(API + '/api/history', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        historyData = await r.json();
        setConn(true);
        renderHistory();
      } catch (e) {
        setConn(false);
        document.getElementById('historyMessagesList').innerHTML = '<div class="empty">Could not reach the server.</div>';
        document.getElementById('historyImagesList').innerHTML = '<div class="empty">Could not reach the server.</div>';
        document.getElementById('historyAudioList').innerHTML = '<div class="empty">Could not reach the server.</div>';
      }
    }

    function sortByDate(arr, newestFirst) {
      return [...arr].sort((a, b) => {
        const ta = a.at || '';
        const tb = b.at || '';
        if (!ta && !tb) return 0;
        if (!ta) return 1;
        if (!tb) return -1;
        return newestFirst ? (tb.localeCompare(ta)) : (ta.localeCompare(tb));
      });
    }

    function renderHistory() {
      let msgs = sortByDate(historyData.messages || [], sortNewestFirst);
      let imgs = sortByDate(historyData.images || [], sortNewestFirst);
      let auds = sortByDate(historyData.audio || [], sortNewestFirst);
      msgs = msgs.slice(0, 50);
      imgs = imgs.slice(0, 50);
      auds = auds.slice(0, 50);

      document.getElementById('historyMessagesList').innerHTML = msgs.length
        ? msgs.map(m => `<div class="history-item"><div><div class="text">${escapeHtml(m.text)}</div><div class="meta">${formatTime(m.at)}${m.source ? ' · ' + escapeHtml(m.source) : ''}</div></div><div class="actions"><button type="button" class="btn btn-danger btn-delete-msg" data-id="${escapeHtml(m.id)}">Delete</button></div></div>`).join('')
        : '<div class="empty">No messages yet. Send one from iOS Shortcuts.</div>';

      document.getElementById('historyImagesList').innerHTML = imgs.length
        ? imgs.map(img => {
            const url = API + '/uploads/' + img.path;
            const dateStr = formatTime(img.at) ? `<div class="meta" style="margin-top:0.25rem">${formatTime(img.at)}</div>` : '';
            return `<div class="img-card"><a href="${url}?dl=1" download><img src="${url}" alt="" loading="lazy" onerror="this.parentElement.parentElement.style.display='none'"></a><div class="info">${escapeHtml(img.name)}${dateStr}</div><div class="img-actions"><a href="${url}?dl=1" download class="btn btn-ghost">Download</a><button type="button" class="btn btn-danger btn-delete-img" data-id="${escapeHtml(img.id)}">Delete</button></div></div>`;
          }).join('')
        : '<div class="empty">No images yet.</div>';

      document.getElementById('historyAudioList').innerHTML = auds.length
        ? auds.map(a => {
            const path = a.path;
            const url = API + '/uploads/' + path;
            const safePath = path.replace(/"/g, '&quot;');
            const dateStr = formatTime(a.at) || 'Audio clip';
            return `<div class="history-item"><div style="flex:1;min-width:0"><div class="text" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(a.name)}</div><div class="meta">${dateStr}</div></div><div class="actions"><button type="button" class="btn btn-ghost btn-play" data-path="${safePath}">Play</button><a href="${url}" download class="btn btn-ghost">Download</a><button type="button" class="btn btn-danger btn-delete-audio" data-id="${escapeHtml(a.id)}">Delete</button></div></div>`;
          }).join('')
        : '<div class="empty">No audio yet.</div>';

      document.querySelectorAll('#historyAudioList .btn-play').forEach(btn => {
        btn.onclick = () => togglePlay(btn);
      });
      document.querySelectorAll('.btn-delete-msg').forEach(btn => {
        btn.onclick = () => deleteItem('messages', btn.dataset.id, btn);
      });
      document.querySelectorAll('.btn-delete-img').forEach(btn => {
        btn.onclick = () => deleteItem('images', btn.dataset.id, btn);
      });
      document.querySelectorAll('.btn-delete-audio').forEach(btn => {
        btn.onclick = () => deleteItem('audio', btn.dataset.id, btn);
      });

      const devs = historyData.devices || {};
      const devList = document.getElementById('devicesList');
      if (devList) {
        const arr = Object.entries(devs).map(([id, d]) => ({ id, ...d }));
        devList.innerHTML = arr.length
          ? arr.map(d => {
              const secondsAgo = d.last_seen ? Math.round((Date.now() - new Date(d.last_seen)) / 1000) : null;
              const ago = secondsAgo === null ? 'unknown' : (secondsAgo < 60 ? secondsAgo + 's ago' : Math.round(secondsAgo / 60) + 'm ago');
              const stale = secondsAgo === null || secondsAgo > 180;
              return `<div class="history-item"><div class="device-row"><span class="device-dot${stale ? ' stale' : ''}"></span><div><div class="device-name">${escapeHtml(d.name || d.id)}</div><div class="meta"><span class="device-id">${escapeHtml(d.id)}</span> · Last seen ${ago}</div></div></div></div>`;
            }).join('')
          : '<div class="empty">No devices registered yet. A heartbeat from the TZT or Main ESP32 will show here.</div>';
      }
    }

    function togglePlay(btn) {
      const url = API + '/uploads/' + (btn.dataset.path || '');
      const player = document.getElementById('audioPlayer');
      if (currentAudioUrl === url && !player.paused) {
        player.pause();
        btn.textContent = 'Play';
        return;
      }
      player.src = url;
      player.play();
      currentAudioUrl = url;
      document.querySelectorAll('#historyAudioList .btn-play').forEach(b => { b.textContent = 'Play'; });
      btn.textContent = 'Pause';
    }

    document.getElementById('audioPlayer').addEventListener('ended', () => {
      document.querySelectorAll('#historyAudioList .btn-play').forEach(b => { b.textContent = 'Play'; });
      currentAudioUrl = null;
    });

    document.getElementById('refreshBtn').onclick = loadHistory;

    document.getElementById('sortOrder').onchange = function() {
      sortNewestFirst = (this.value === 'newest');
      renderHistory();
    };

    // Some browsers/extensions silently block window.confirm() (it returns false
    // with no dialog shown), which made every delete/clear button a silent no-op.
    // This replaces it with an in-page "click again to confirm" arm-then-fire pattern.
    function confirmAction(btn, onConfirm) {
      if (btn.dataset.armed === '1') {
        clearTimeout(btn._confirmTimer);
        btn.dataset.armed = '0';
        btn.textContent = btn.dataset.origText;
        btn.classList.remove('confirming');
        onConfirm();
        return;
      }
      btn.dataset.origText = btn.textContent;
      btn.dataset.armed = '1';
      btn.textContent = 'Click again to confirm';
      btn.classList.add('confirming');
      btn._confirmTimer = setTimeout(() => {
        btn.dataset.armed = '0';
        btn.textContent = btn.dataset.origText;
        btn.classList.remove('confirming');
      }, 3000);
    }

    async function clearHistory(type, btn) {
      confirmAction(btn, async () => {
        try {
          const r = await fetch(API + '/api/history/' + type, { method: 'DELETE', cache: 'no-store', headers: AUTH_HEADERS });
          if (r.ok || r.status === 204) { showToast('Cleared'); await loadHistory(); }
          else showToast('Failed to clear', true);
        } catch (e) { showToast('Failed to clear', true); }
      });
    }

    async function deleteItem(type, id, btn) {
      if (!id) return;
      confirmAction(btn, async () => {
        try {
          const r = await fetch(API + '/api/' + type + '/' + encodeURIComponent(id), { method: 'DELETE', cache: 'no-store', headers: AUTH_HEADERS });
          if (r.ok || r.status === 204) { showToast('Deleted'); await loadHistory(); }
          else showToast('Failed to delete (' + r.status + ')', true);
        } catch (e) { showToast('Failed to delete', true); }
      });
    }

    document.getElementById('clearAllBtn').onclick = function() { clearHistory('all', this); };
    document.getElementById('clearMessagesBtn').onclick = function() { clearHistory('messages', this); };
    document.getElementById('clearImagesBtn').onclick = function() { clearHistory('images', this); };
    document.getElementById('clearAudioBtn').onclick = function() { clearHistory('audio', this); };

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'history' || btn.dataset.tab === 'devices') loadHistory();
      };
    });

    document.querySelectorAll('.hist-tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.hist-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.hist-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('history-' + btn.dataset.hist).classList.add('active');
      };
    });

    loadHistory();
    setInterval(loadHistory, 10000);  // auto-refresh every 10s so iOS Shortcut messages appear
  </script>
</body>
</html>
