<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prick'n'Print Console</title>
  <meta name="theme-color" content="#1C2A1F">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
  <style>
    /* Page layout only - colours and components come from static/theme.css */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .tabs button {
      padding: 10px 16px; background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
      color: var(--text-muted); font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active { color: var(--accent-light); border-bottom-color: var(--accent); }
    .tab-panel, .hist-panel { display: none; }
    .tab-panel.active, .hist-panel.active { display: block; }

    /* Segmented control - same as the screen's Photo/Audio toggle: active gets the primary fill */
    .history-tabs { display: inline-flex; gap: 6px; margin-bottom: 14px; }
    .history-tabs button {
      min-height: 36px; padding: 6px 16px; border: none; border-radius: var(--radius-sm);
      background: var(--button); color: var(--text); font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .history-tabs button:hover { background: var(--fi-selection); }
    .history-tabs button.active { background: var(--accent); color: var(--fi-title); }

    .hist-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .hist-actions .spacer { flex: 1; }
    .hist-actions .field-label { color: var(--text-faint); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .hist-actions select { min-height: 36px; padding: 4px 10px; font-size: 0.85rem; }
    .hist-actions .btn { min-height: 36px; padding: 6px 12px; font-size: 0.8rem; }

    /* Rows reuse the theme's list-row card */
    .history-list { max-height: 520px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .history-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 52px; padding: 10px 12px 10px 14px; background: var(--surface); border-radius: var(--radius-sm); font-size: 0.9rem;
    }
    .card .history-item { background: var(--surface-2); }
    .history-item .text { overflow-wrap: anywhere; }
    .history-item .meta { color: var(--text-faint); font-size: 0.75rem; font-family: var(--font-mono); margin-top: 2px; }
    .history-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .history-item .btn { min-height: 34px; padding: 6px 12px; font-size: 0.8rem; }

    .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .img-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
    .img-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface-2); }
    .img-card .info { padding: 8px 10px 4px; font-size: 0.78rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .img-card .img-actions { padding: 4px 10px 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .img-card .btn { min-height: 32px; padding: 4px 10px; font-size: 0.78rem; }
    .img-grid .empty { grid-column: 1 / -1; }

    .card-note { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 14px; }
    .device-row { display: flex; align-items: center; gap: 12px; }
    .device-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-light); flex-shrink: 0; box-shadow: 0 0 0 3px var(--accent-dim); }
    .device-dot.stale { background: var(--text-faint); box-shadow: none; }
    .device-name { font-weight: 600; }
    .device-id { font-family: var(--font-mono); color: var(--text-faint); font-size: 0.75rem; }

    @media (max-width: 560px) {
      .hist-actions .spacer { flex-basis: 100%; height: 0; }
      .history-item { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Prick'n'Print</h1>
      <div class="sub">Console · send from iOS Shortcuts</div>
    </div>
    <span class="spacer"></span>
    <span class="status-pill" id="connPill"><span class="dot"></span><span id="connLabel">connecting</span></span>
  </header>
  <div class="page">
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="history">History</button>
      <button type="button" class="tab-btn" data-tab="devices">Devices</button>
    </div>

    <div id="panel-history" class="tab-panel active">
      <div class="history-tabs">
        <button type="button" class="hist-tab active" data-hist="messages">Messages</button>
        <button type="button" class="hist-tab" data-hist="images">Images</button>
        <button type="button" class="hist-tab" data-hist="audio">Audio</button>
      </div>
      <div class="hist-actions">
        <span class="field-label">Sort</span>
        <select id="sortOrder">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
        <button type="button" class="btn btn-ghost" id="refreshBtn">Refresh</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" id="clearMessagesBtn">Clear messages</button>
        <button type="button" class="btn btn-ghost" id="clearImagesBtn">Clear images</button>
        <button type="button" class="btn btn-ghost" id="clearAudioBtn">Clear audio</button>
        <button type="button" class="btn btn-danger solid" id="clearAllBtn">Clear all</button>
      </div>
      <div id="history-messages" class="hist-panel active">
        <div class="history-list" id="historyMessagesList"><div class="empty">Loading…</div></div>
      </div>
      <div id="history-images" class="hist-panel">
        <div class="img-grid" id="historyImagesList"></div>
      </div>
      <div id="history-audio" class="hist-panel">
        <div class="history-list" id="historyAudioList"><div class="empty">Loading…</div></div>
      </div>
    </div>

    <div id="panel-devices" class="tab-panel">
      <div class="card">
        <h2>Connected devices</h2>
        <p class="card-note">ESP32s that have sent a heartbeat appear here. TZT Display and Main ESP32 register when they poll.</p>
        <div id="devicesList" class="history-list"><div class="empty">Loading…</div></div>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" style="display:none"></audio>
  <div id="toast"></div>

  <script>
    const API = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
    const API_KEY = {{ api_key | tojson }};
    const AUTH_HEADERS = { 'X-API-Key': API_KEY };
    let historyData = { messages: [], images: [], audio: [], devices: {} };
    let currentAudioUrl = null;
    let sortNewestFirst = true;

    function showToast(msg, err = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast' + (err ? ' err' : '');
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function setConn(ok) {
      const pill = document.getElementById('connPill');
      const label = document.getElementById('connLabel');
      pill.className = 'status-pill ' + (ok ? 'ok' : 'bad');
      label.textContent = ok ? 'online' : 'unreachable';
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString();
    }

    async function loadHistory() {
      try {
        const r = await fetch(API + '/api/history', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        historyData = await r.json();
        setConn(true);
        renderHistory();
      } catch (e) {
        setConn(false);
        document.getElementById('historyMessagesList').innerHTML = '<div class="empty">Could not reach the server.</div>';
        document.getElementById('historyImagesList').innerHTML = '<div class="empty">Could not reach the server.</div>';
        document.getElementById('historyAudioList').innerHTML = '<div class="empty">Could not reach the server.</div>';
      }
    }

    function sortByDate(arr, newestFirst) {
      return [...arr].sort((a, b) => {
        const ta = a.at || '';
        const tb = b.at || '';
        if (!ta && !tb) return 0;
        if (!ta) return 1;
        if (!tb) return -1;
        return newestFirst ? (tb.localeCompare(ta)) : (ta.localeCompare(tb));
      });
    }

    function renderHistory() {
      let msgs = sortByDate(historyData.messages || [], sortNewestFirst);
      let imgs = sortByDate(historyData.images || [], sortNewestFirst);
      let auds = sortByDate(historyData.audio || [], sortNewestFirst);
      msgs = msgs.slice(0, 50);
      imgs = imgs.slice(0, 50);
      auds = auds.slice(0, 50);

      document.getElementById('historyMessagesList').innerHTML = msgs.length
        ? msgs.map(m => `<div class="history-item"><div><div class="text">${escapeHtml(m.text)}</div><div class="meta">${formatTime(m.at)}${m.source ? ' · ' + escapeHtml(m.source) : ''}</div></div><div class="actions"><button type="button" class="btn btn-danger btn-delete-msg" data-id="${escapeHtml(m.id)}">Delete</button></div></div>`).join('')
        : '<div class="empty">No messages yet. Send one from iOS Shortcuts.</div>';

      document.getElementById('historyImagesList').innerHTML = imgs.length
        ? imgs.map(img => {
            const url = API + '/uploads/' + img.path;
            const dateStr = formatTime(img.at) ? `<div class="meta" style="margin-top:0.25rem">${formatTime(img.at)}</div>` : '';
            return `<div class="img-card"><a href="${url}?dl=1" download><img src="${url}" alt="" loading="lazy" onerror="this.parentElement.parentElement.style.display='none'"></a><div class="info">${escapeHtml(img.name)}${dateStr}</div><div class="img-actions"><a href="${url}?dl=1" download class="btn btn-ghost">Download</a><button type="button" class="btn btn-danger btn-delete-img" data-id="${escapeHtml(img.id)}">Delete</button></div></div>`;
          }).join('')
        : '<div class="empty">No images yet.</div>';

      document.getElementById('historyAudioList').innerHTML = auds.length
        ? auds.map(a => {
            const path = a.path;
            const url = API + '/uploads/' + path;
            const safePath = path.replace(/"/g, '&quot;');
            const dateStr = formatTime(a.at) || 'Audio clip';
            return `<div class="history-item"><div style="flex:1;min-width:0"><div class="text" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(a.name)}</div><div class="meta">${dateStr}</div></div><div class="actions"><button type="button" class="btn btn-ghost btn-play" data-path="${safePath}">Play</button><a href="${url}" download class="btn btn-ghost">Download</a><button type="button" class="btn btn-danger btn-delete-audio" data-id="${escapeHtml(a.id)}">Delete</button></div></div>`;
          }).join('')
        : '<div class="empty">No audio yet.</div>';

      document.querySelectorAll('#historyAudioList .btn-play').forEach(btn => {
        btn.onclick = () => togglePlay(btn);
      });
      document.querySelectorAll('.btn-delete-msg').forEach(btn => {
        btn.onclick = () => deleteItem('messages', btn.dataset.id, btn);
      });
      document.querySelectorAll('.btn-delete-img').forEach(btn => {
        btn.onclick = () => deleteItem('images', btn.dataset.id, btn);
      });
      document.querySelectorAll('.btn-delete-audio').forEach(btn => {
        btn.onclick = () => deleteItem('audio', btn.dataset.id, btn);
      });

      const devs = historyData.devices || {};
      const devList = document.getElementById('devicesList');
      if (devList) {
        const arr = Object.entries(devs).map(([id, d]) => ({ id, ...d }));
        devList.innerHTML = arr.length
          ? arr.map(d => {
              const secondsAgo = d.last_seen ? Math.round((Date.now() - new Date(d.last_seen)) / 1000) : null;
              const ago = secondsAgo === null ? 'unknown' : (secondsAgo < 60 ? secondsAgo + 's ago' : Math.round(secondsAgo / 60) + 'm ago');
              const stale = secondsAgo === null || secondsAgo > 180;
              return `<div class="history-item"><div class="device-row"><span class="device-dot${stale ? ' stale' : ''}"></span><div><div class="device-name">${escapeHtml(d.name || d.id)}</div><div class="meta"><span class="device-id">${escapeHtml(d.id)}</span> · Last seen ${ago}</div></div></div></div>`;
            }).join('')
          : '<div class="empty">No devices registered yet. A heartbeat from the TZT or Main ESP32 will show here.</div>';
      }
    }

    function togglePlay(btn) {
      const url = API + '/uploads/' + (btn.dataset.path || '');
      const player = document.getElementById('audioPlayer');
      if (currentAudioUrl === url && !player.paused) {
        player.pause();
        btn.textContent = 'Play';
        return;
      }
      player.src = url;
      player.play();
      currentAudioUrl = url;
      document.querySelectorAll('#historyAudioList .btn-play').forEach(b => { b.textContent = 'Play'; });
      btn.textContent = 'Pause';
    }

    document.getElementById('audioPlayer').addEventListener('ended', () => {
      document.querySelectorAll('#historyAudioList .btn-play').forEach(b => { b.textContent = 'Play'; });
      currentAudioUrl = null;
    });

    document.getElementById('refreshBtn').onclick = loadHistory;

    document.getElementById('sortOrder').onchange = function() {
      sortNewestFirst = (this.value === 'newest');
      renderHistory();
    };

    // Some browsers/extensions silently block window.confirm() (it returns false
    // with no dialog shown), which made every delete/clear button a silent no-op.
    // This replaces it with an in-page "click again to confirm" arm-then-fire pattern.
    function confirmAction(btn, onConfirm) {
      if (btn.dataset.armed === '1') {
        clearTimeout(btn._confirmTimer);
        btn.dataset.armed = '0';
        btn.textContent = btn.dataset.origText;
        btn.classList.remove('confirming');
        onConfirm();
        return;
      }
      btn.dataset.origText = btn.textContent;
      btn.dataset.armed = '1';
      btn.textContent = 'Click again to confirm';
      btn.classList.add('confirming');
      btn._confirmTimer = setTimeout(() => {
        btn.dataset.armed = '0';
        btn.textContent = btn.dataset.origText;
        btn.classList.remove('confirming');
      }, 3000);
    }

    async function clearHistory(type, btn) {
      confirmAction(btn, async () => {
        try {
          const r = await fetch(API + '/api/history/' + type, { method: 'DELETE', cache: 'no-store', headers: AUTH_HEADERS });
          if (r.ok || r.status === 204) { showToast('Cleared'); await loadHistory(); }
          else showToast('Failed to clear', true);
        } catch (e) { showToast('Failed to clear', true); }
      });
    }

    async function deleteItem(type, id, btn) {
      if (!id) return;
      confirmAction(btn, async () => {
        try {
          const r = await fetch(API + '/api/' + type + '/' + encodeURIComponent(id), { method: 'DELETE', cache: 'no-store', headers: AUTH_HEADERS });
          if (r.ok || r.status === 204) { showToast('Deleted'); await loadHistory(); }
          else showToast('Failed to delete (' + r.status + ')', true);
        } catch (e) { showToast('Failed to delete', true); }
      });
    }

    document.getElementById('clearAllBtn').onclick = function() { clearHistory('all', this); };
    document.getElementById('clearMessagesBtn').onclick = function() { clearHistory('messages', this); };
    document.getElementById('clearImagesBtn').onclick = function() { clearHistory('images', this); };
    document.getElementById('clearAudioBtn').onclick = function() { clearHistory('audio', this); };

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'history' || btn.dataset.tab === 'devices') loadHistory();
      };
    });

    document.querySelectorAll('.hist-tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.hist-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.hist-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('history-' + btn.dataset.hist).classList.add('active');
      };
    });

    loadHistory();
    setInterval(loadHistory, 10000);  // auto-refresh every 10s so iOS Shortcut messages appear
  </script>
</body>
</html>
